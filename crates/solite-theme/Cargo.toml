[package]
name = "solite-theme"
version = "0.0.1-alpha.1"
edition = "2021"
repository = "https://github.com/asg017/solite"
description = "Shared semantic-role color theme for Solite"

[dependencies]
# Keep the core dependency-free. Terminal/TUI backends are opt-in so that
# crates like solite-table can depend on solite-theme without pulling ratatui.
ratatui = { version = "0.30.0-alpha.5", optional = true }
termcolor = { version = "1.3.0", optional = true }

[features]
default = []
ratatui = ["dep:ratatui"]
termcolor = ["dep:termcolor"]
